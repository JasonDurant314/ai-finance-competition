[pytest]
# ==========================================================================
# pytest 配置
# ==========================================================================

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 输出
addopts =
    -ra
    --strict-markers
    --tb=short
    # 禁用 pytest 的缓存插件。
    # 原因：cacheprovider 写入时会在 cache 目录的**父目录**创建
    # `pytest-cache-files-*` 临时目录，而受限沙箱禁止对目录做枚举/清理，
    # 于是每次运行都在仓库里留下无法删除的残留目录，并伴随 WinError 5 告警。
    # 本项目不使用 --lf / --ff（增量重跑），禁用后无功能损失。
    -p no:cacheprovider

markers =
    slow: 端到端测试（会真实运行完整流水线，耗时较长）

# 过滤：matplotlib 在受限环境下会重复告警，与测试逻辑无关
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
